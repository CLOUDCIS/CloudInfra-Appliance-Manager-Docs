site_name: CloudInfra Appliance Manager
site_description: >-
  Security assessment, remediation and drift detection for Linux appliances,
  with an NGINX reverse proxy module.
site_url: https://cloudcis.github.io/CloudInfra-Appliance-Manager-Docs/
repo_url: https://github.com/CLOUDCIS/CloudInfra-Appliance-Manager-Docs
edit_uri: edit/main/docs/

copyright: Cloud Infrastructure Services

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - First boot: getting-started/first-boot.md
      - Quickstart: getting-started/quickstart.md
  - User Guide:
      - Security assessment: guide/security-assessment.md
      - Remediation: guide/remediation.md
      - Configuration drift: guide/drift.md
      - Backups and restore: guide/backups.md
      - Firewall: guide/firewall.md
      - Services and health: guide/services-and-health.md
      - Logs: guide/logs.md
      - Updates: guide/updates.md
      - Reports: guide/reports.md
      - Alerts: guide/alerts.md
      - Users and roles: guide/users-and-roles.md
  - Modules:
      - Overview: modules/index.md
      - NGINX: modules/nginx.md
      - Generic Linux: modules/generic-linux.md
  - Reference:
      - Control catalogue: reference/controls.md
      - Command line: reference/cli.md
      - Ports and paths: reference/ports-and-paths.md
  - About:
      - Architecture: about/architecture.md
      - FAQ: about/faq.md
      - Support: about/support.md
